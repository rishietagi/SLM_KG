# The 11 CPG value-chain stages. Names, purposes and activity lists: cpg_value_chain_design.md §4.
# definition: summarised from the stage's activity list. entry/exit events: drafted from the §2 flow chain
# (review_note on each row). PRECEDES follows the §2 hierarchy order.
class: ValueChainStage
defaults:
  source_system: curated_reference
  lane: curated
  extraction_confidence: 1.0
  reviewed: false
  drafted_beyond_source: false
  review_note: "definition summarised from the activity list; entry_event/exit_event drafted from the §2 flow chain"
rows:
  - id: "ValueChainStage:s01_consumer_market_insight"
    name: Consumer and Market Insight
    stage_number: 1
    aliases: [consumer and market insight, market insight]
    purpose: "Identify changing needs, behaviours, occasions, category shifts and market opportunities."
    definition: "Sensing consumer, shopper, competitor and geographic signals and turning them into sized opportunity hypotheses."
    entry_event: "BusinessEvent:market_signal_detected"
    exit_event: "BusinessEvent:category_opportunity_identified"
    downstream_stage: "ValueChainStage:s02_portfolio_category_strategy"
    source_reference: "docs/source/cpg_value_chain_design.md#stage-1-consumer-and-market-insight"
    edges:
      PRECEDES: ["ValueChainStage:s02_portfolio_category_strategy"]
      SUPPORTED_BY_EVIDENCE: ["SourceEvidence:design_s01", "SourceEvidence:design_l1_hierarchy"]
      CONTAINS:
        - "ValueChainActivity:s01_monitor_trends"
        - "ValueChainActivity:s01_analyze_shopper_behaviour"
        - "ValueChainActivity:s01_identify_need_states"
        - "ValueChainActivity:s01_analyze_competition"
        - "ValueChainActivity:s01_identify_geo_variation"
        - "ValueChainActivity:s01_estimate_category_opportunity"
        - "ValueChainActivity:s01_create_opportunity_hypotheses"

  - id: "ValueChainStage:s02_portfolio_category_strategy"
    name: Portfolio and Category Strategy
    stage_number: 2
    aliases: [portfolio and category strategy, category strategy]
    purpose: "Translate market opportunities into portfolio, category, brand and investment choices."
    definition: "Setting category strategy, brand roles, portfolio scope, innovation priorities, price-pack architecture and investment allocation."
    entry_event: "BusinessEvent:category_opportunity_identified"
    exit_event: "BusinessEvent:innovation_brief_issued"
    upstream_stage: "ValueChainStage:s01_consumer_market_insight"
    downstream_stage: "ValueChainStage:s03_product_innovation_formulation"
    source_reference: "docs/source/cpg_value_chain_design.md#stage-2-portfolio-and-category-strategy"
    edges:
      PRECEDES: ["ValueChainStage:s03_product_innovation_formulation"]
      SUPPORTED_BY_EVIDENCE: ["SourceEvidence:design_s02", "SourceEvidence:design_l1_hierarchy"]
      CONTAINS:
        - "ValueChainActivity:s02_define_category_strategy"
        - "ValueChainActivity:s02_set_brand_role"
        - "ValueChainActivity:s02_identify_portfolio_gaps"
        - "ValueChainActivity:s02_rationalize_portfolio"
        - "ValueChainActivity:s02_set_innovation_priorities"
        - "ValueChainActivity:s02_define_price_pack_architecture"
        - "ValueChainActivity:s02_allocate_category_investment"
        - "ValueChainActivity:s02_determine_launch_priorities"

  - id: "ValueChainStage:s03_product_innovation_formulation"
    name: Product Innovation and Formulation
    stage_number: 3
    aliases: [product innovation and formulation, R&D, product development]
    purpose: "Convert a consumer opportunity into a scalable, compliant product."
    definition: "Concept creation, formulation or recipe development, trials and testing, claims, shelf-life and regulatory work up to an approved product specification."
    entry_event: "BusinessEvent:innovation_brief_issued"
    exit_event: "BusinessEvent:formulation_approved"
    upstream_stage: "ValueChainStage:s02_portfolio_category_strategy"
    downstream_stage: "ValueChainStage:s04_ingredient_packaging_sourcing"
    source_reference: "docs/source/cpg_value_chain_design.md#stage-3-product-innovation-and-formulation"
    edges:
      PRECEDES: ["ValueChainStage:s04_ingredient_packaging_sourcing"]
      SUPPORTED_BY_EVIDENCE: ["SourceEvidence:design_s03", "SourceEvidence:design_l1_hierarchy"]
      CONTAINS:
        - "ValueChainActivity:s03_create_product_concept"
        - "ValueChainActivity:s03_develop_formulation"
        - "ValueChainActivity:s03_select_ingredient_alternatives"
        - "ValueChainActivity:s03_conduct_lab_trials"
        - "ValueChainActivity:s03_test_product_performance"
        - "ValueChainActivity:s03_validate_sensory"
        - "ValueChainActivity:s03_define_product_claims"
        - "ValueChainActivity:s03_stability_shelf_life_tests"
        - "ValueChainActivity:s03_regulatory_review"
        - "ValueChainActivity:s03_approve_product_specification"

  - id: "ValueChainStage:s04_ingredient_packaging_sourcing"
    name: Ingredient and Packaging Sourcing
    stage_number: 4
    aliases: [ingredient and packaging sourcing, ingredients and packaging sourcing, procurement]
    purpose: "Secure qualified materials at the required cost, quality, lead time and risk level."
    definition: "Turning formulations into material requirements, qualifying suppliers, running sourcing events, contracting, approving materials and placing purchase orders."
    entry_event: "BusinessEvent:material_requirement_released"
    exit_event: "BusinessEvent:sourcing_decision_made"
    upstream_stage: "ValueChainStage:s03_product_innovation_formulation"
    downstream_stage: "ValueChainStage:s05_manufacturing_quality_packaging"
    source_reference: "docs/source/cpg_value_chain_design.md#stage-4-ingredient-and-packaging-sourcing"
    edges:
      PRECEDES: ["ValueChainStage:s05_manufacturing_quality_packaging"]
      SUPPORTED_BY_EVIDENCE: ["SourceEvidence:design_s04", "SourceEvidence:design_l1_hierarchy"]
      CONTAINS:
        - "ValueChainActivity:s04_translate_material_requirements"
        - "ValueChainActivity:s04_qualify_suppliers"
        - "ValueChainActivity:s04_conduct_sourcing_event"
        - "ValueChainActivity:s04_negotiate_contract"
        - "ValueChainActivity:s04_assess_supplier_capacity"
        - "ValueChainActivity:s04_evaluate_commodity_exposure"
        - "ValueChainActivity:s04_approve_ingredients_packaging"
        - "ValueChainActivity:s04_place_purchase_order"
        - "ValueChainActivity:s04_monitor_supply_risk"

  - id: "ValueChainStage:s05_manufacturing_quality_packaging"
    name: Manufacturing, Quality and Packaging
    stage_number: 5
    aliases: [manufacturing quality and packaging, manufacturing, production]
    purpose: "Convert materials into compliant, saleable packaged goods."
    definition: "Planning and executing production: material release, batching, processing, in-process and finished-product quality, packaging, labelling, batch release and yield recording."
    entry_event: "BusinessEvent:production_plan_released"
    exit_event: "BusinessEvent:finished_sku_released"
    upstream_stage: "ValueChainStage:s04_ingredient_packaging_sourcing"
    downstream_stage: "ValueChainStage:s06_demand_supply_inventory_planning"
    source_reference: "docs/source/cpg_value_chain_design.md#stage-5-manufacturing-quality-and-packaging"
    edges:
      PRECEDES: ["ValueChainStage:s06_demand_supply_inventory_planning"]
      SUPPORTED_BY_EVIDENCE: ["SourceEvidence:design_s05", "SourceEvidence:design_l1_hierarchy"]
      CONTAINS:
