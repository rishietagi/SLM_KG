        - "ValueChainActivity:s05_issue_production_order"
        - "ValueChainActivity:s05_receive_release_materials"
        - "ValueChainActivity:s05_batch_formulate"
        - "ValueChainActivity:s05_process_fill_form"
        - "ValueChainActivity:s05_in_process_quality_checks"
        - "ValueChainActivity:s05_package_label"
        - "ValueChainActivity:s05_finished_product_testing"
        - "ValueChainActivity:s05_release_quarantine_batch"
        - "ValueChainActivity:s05_record_yield_loss_downtime"

  - id: "ValueChainStage:s06_demand_supply_inventory_planning"
    name: Demand, Supply and Inventory Planning
    stage_number: 6
    aliases: [demand supply and inventory planning, demand and supply planning, S&OP, IBP]
    purpose: "Balance expected demand, available capacity, materials and inventory."
    definition: "Forecasting (baseline, uplift, consensus), supply and capacity planning, material requirements, inventory targets, constrained allocation and S&OP/IBP approval."
    entry_event: "BusinessEvent:demand_planning_cycle_started"
    exit_event: "BusinessEvent:replenishment_plan_approved"
    upstream_stage: "ValueChainStage:s05_manufacturing_quality_packaging"
    downstream_stage: "ValueChainStage:s07_warehousing_distribution"
    source_reference: "docs/source/cpg_value_chain_design.md#stage-6-demand-supply-and-inventory-planning"
    edges:
      PRECEDES: ["ValueChainStage:s07_warehousing_distribution"]
      SUPPORTED_BY_EVIDENCE: ["SourceEvidence:design_s06", "SourceEvidence:design_l1_hierarchy"]
      CONTAINS:
        - "ValueChainActivity:s06_baseline_forecast"
        - "ValueChainActivity:s06_promotion_event_uplift"
        - "ValueChainActivity:s06_consensus_forecast"
        - "ValueChainActivity:s06_supply_plan"
        - "ValueChainActivity:s06_capacity_planning"
        - "ValueChainActivity:s06_material_requirement"
        - "ValueChainActivity:s06_set_inventory_target"
        - "ValueChainActivity:s06_allocate_constrained_supply"
        - "ValueChainActivity:s06_sop_ibp_review"
        - "ValueChainActivity:s06_approve_replenishment_plan"

  - id: "ValueChainStage:s07_warehousing_distribution"
    name: Warehousing and Distribution
    stage_number: 7
    aliases: [warehousing and distribution, distribution and fulfilment, logistics]
    purpose: "Position inventory and fulfil customer demand at the required service level and cost."
    definition: "Receiving, storing, allocating, picking, transporting and delivering finished goods, confirming delivery, handling returns and monitoring freshness."
    entry_event: "BusinessEvent:finished_sku_released"
    exit_event: "BusinessEvent:delivered_to_distributor_retailer"
    upstream_stage: "ValueChainStage:s06_demand_supply_inventory_planning"
    downstream_stage: "ValueChainStage:s08_customer_channel_revenue_growth"
    source_reference: "docs/source/cpg_value_chain_design.md#stage-7-warehousing-and-distribution"
    edges:
      PRECEDES: ["ValueChainStage:s08_customer_channel_revenue_growth"]
      SUPPORTED_BY_EVIDENCE: ["SourceEvidence:design_s07", "SourceEvidence:design_l1_hierarchy"]
      CONTAINS:
        - "ValueChainActivity:s07_receive_finished_goods"
        - "ValueChainActivity:s07_put_away"
        - "ValueChainActivity:s07_allocate_inventory"
        - "ValueChainActivity:s07_pick_pack"
        - "ValueChainActivity:s07_plan_transport"
        - "ValueChainActivity:s07_dispatch_shipment"
        - "ValueChainActivity:s07_deliver"
        - "ValueChainActivity:s07_confirm_pod"
        - "ValueChainActivity:s07_process_returns"
        - "ValueChainActivity:s07_monitor_freshness_expiry"

  - id: "ValueChainStage:s08_customer_channel_revenue_growth"
    name: Customer, Channel and Revenue Growth
    stage_number: 8
    aliases: [customer channel and revenue growth, "channel, customer and revenue growth management", RGM, revenue growth management]
    purpose: "Translate the portfolio into volume, revenue and margin through channel and customer choices."
    definition: "Customer segmentation, route-to-market design, pricing and terms, joint business plans, promotions and trade schemes, agreements, sales targets, order capture and distributor management."
    entry_event: "BusinessEvent:customer_planning_cycle_started"
    exit_event: "BusinessEvent:customer_order_received"
    upstream_stage: "ValueChainStage:s07_warehousing_distribution"
    downstream_stage: "ValueChainStage:s09_retail_outlet_execution"
    source_reference: "docs/source/cpg_value_chain_design.md#stage-8-customer-channel-and-revenue-growth"
    edges:
      PRECEDES: ["ValueChainStage:s09_retail_outlet_execution"]
      SUPPORTED_BY_EVIDENCE: ["SourceEvidence:design_s08", "SourceEvidence:design_l1_hierarchy"]
      CONTAINS:
        - "ValueChainActivity:s08_segment_customers"
        - "ValueChainActivity:s08_design_route_to_market"
        - "ValueChainActivity:s08_set_pricing_terms"
        - "ValueChainActivity:s08_joint_business_plan"
        - "ValueChainActivity:s08_plan_promotion"
        - "ValueChainActivity:s08_create_trade_scheme"
        - "ValueChainActivity:s08_negotiate_customer_agreement"
        - "ValueChainActivity:s08_set_sales_target"
        - "ValueChainActivity:s08_capture_order"
        - "ValueChainActivity:s08_manage_distributor_performance"

  - id: "ValueChainStage:s09_retail_outlet_execution"
    name: Retail and Outlet Execution
    stage_number: 9
    aliases: [retail and outlet execution, channel and retail execution, outlet execution]
    purpose: "Convert distribution into availability, visibility and sell-through."
    definition: "Outlet classification, beat planning and visits, order capture, inventory and on-shelf checks, assortment, planogram and display, promotion activation, scheme compliance and sell-out capture."
    entry_event: "BusinessEvent:delivered_to_distributor_retailer"
    exit_event: "BusinessEvent:outlet_availability_achieved"
    upstream_stage: "ValueChainStage:s08_customer_channel_revenue_growth"
    downstream_stage: "ValueChainStage:s10_purchase_consumption_feedback"
    source_reference: "docs/source/cpg_value_chain_design.md#stage-9-retail-and-outlet-execution"
    edges:
