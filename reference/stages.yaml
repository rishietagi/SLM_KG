  - id: "ValueChainStage:s11_returns_waste_circularity"
    name: Returns, Waste and Circularity
    stage_number: 11
    aliases: [returns waste and circularity, circularity, reverse logistics]
    purpose: "Manage product returns, packaging recovery, expiry, waste and downstream sustainability."
    definition: "Returns processing, damaged/expired product handling, recalls, disposal or rework, packaging recovery and recycling, waste measurement, sustainability tracing and corrective action."
    entry_event: "BusinessEvent:product_return_or_expiry_identified"
    exit_event: "BusinessEvent:return_disposition_completed"
    upstream_stage: "ValueChainStage:s10_purchase_consumption_feedback"
    source_reference: "docs/source/cpg_value_chain_design.md#stage-11-returns-waste-and-circularity"
