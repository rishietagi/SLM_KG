        - "ValueChainActivity:s09_plan_sales_beat"
        - "ValueChainActivity:s09_visit_outlet"
        - "ValueChainActivity:s09_capture_order"
        - "ValueChainActivity:s09_check_inventory"
        - "ValueChainActivity:s09_check_osa"
        - "ValueChainActivity:s09_execute_assortment"
        - "ValueChainActivity:s09_verify_planogram_display"
        - "ValueChainActivity:s09_activate_promotion"
        - "ValueChainActivity:s09_track_scheme_compliance"
        - "ValueChainActivity:s09_capture_sell_out"

  - id: "ValueChainStage:s10_purchase_consumption_feedback"
    name: Purchase, Consumption and Feedback
    stage_number: 10
    aliases: [purchase consumption and feedback, "consumer purchase, consumption and feedback"]
    purpose: "Understand conversion from product availability to consumer purchase, usage, satisfaction and repeat behaviour."
    definition: "The consumer path from discovery and evaluation through purchase, consumption, feedback, complaint, recommendation, repurchase or switching."
    entry_event: "BusinessEvent:outlet_availability_achieved"
    exit_event: "BusinessEvent:consumption_feedback_received"
    upstream_stage: "ValueChainStage:s09_retail_outlet_execution"
    downstream_stage: "ValueChainStage:s11_returns_waste_circularity"
    source_reference: "docs/source/cpg_value_chain_design.md#stage-10-purchase-consumption-and-feedback"
    edges:
