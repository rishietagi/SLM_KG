         edges: {BECOMES_INPUT_TO: ["ValueChainActivity:s11_dispose_rework"]}}
      - {id: "Output:s11_product_recall", name: Product recall, output_type: event,
         edges: {BECOMES_INPUT_TO: ["ValueChainActivity:s07_process_returns"]}}
      - {id: "Output:s11_disposal_event", name: Disposal event, output_type: event,
         edges: {BECOMES_INPUT_TO: ["ValueChainActivity:s11_measure_waste"]}}
      - {id: "Output:s11_recycled_material", name: Recycled material, output_type: material,
         edges: {BECOMES_INPUT_TO: ["ValueChainActivity:s04_approve_ingredients_packaging"]}}
      - {id: "Output:s11_waste_measure", name: Waste measure, output_type: data,
         edges: {BECOMES_INPUT_TO: ["ValueChainActivity:s11_trace_sustainability"]}}
      - {id: "Output:s11_sustainability_outcome", name: Sustainability outcome, output_type: information,
         edges: {BECOMES_INPUT_TO: ["ValueChainActivity:s02_set_innovation_priorities"]}}
      - {id: "Output:s11_corrective_action", name: Corrective action (returns and quality), output_type: decision,
         edges: {BECOMES_INPUT_TO: ["ValueChainActivity:s05_in_process_quality_checks"]}}
