        - {to: "ProductAssetConcept:packaging_specification", source_reference: "docs/PROJECT_CONTEXT.md#54-the-11-stages"}
      HAS:
        - {to: "ProductAssetConcept:shelf_life", source_reference: "docs/PROJECT_CONTEXT.md#54-the-11-stages"}
        - {to: "ProductAssetConcept:quality_specification", source_reference: "docs/PROJECT_CONTEXT.md#54-the-11-stages"}
      BELONGS_TO:
        - {to: "ProductAssetConcept:product_family", source_reference: "docs/source/finance_extraction_spec.md#3-canonical-relationships"}
      PRICED_AT:
        - {to: "ProductAssetConcept:pack_price_point", drafted_beyond_source: true}
      CONSUMED_IN:
        - {to: "ConsumerConcept:consumption_occasion", source_reference: "docs/PROJECT_CONTEXT.md#54-the-11-stages"}
  - id: "ProductAssetConcept:batch"
    name: "Batch and lot"
    concept_group: manufacturing
    aliases: ["batch", "lot"]
    edges:
