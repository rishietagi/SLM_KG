# Layer 3 product and asset concepts (names: design notes Layer 3 list). Edges: PROJECT_CONTEXT §5.4 / §6.1; uncited ones drafted.
class: ProductAssetConcept
defaults:
  source_system: curated_reference
  lane: curated
  extraction_confidence: 1.0
  reviewed: false
  drafted_beyond_source: false
  source_reference: "docs/source/cpg_value_chain_design.md#layer-3-product-and-asset"
rows:
  - id: "ProductAssetConcept:brand"
    name: "Brand"
    concept_group: portfolio
    aliases: ["brand"]
  - id: "ProductAssetConcept:category"
    name: "Category"
    concept_group: portfolio
    aliases: ["product category"]
  - id: "ProductAssetConcept:product_family"
    name: "Product family"
    concept_group: portfolio
    aliases: ["product line"]
    edges:
