      STORED_AT:
        - {to: "ProductAssetConcept:warehouse", source_reference: "docs/PROJECT_CONTEXT.md#54-the-11-stages"}
  - id: "ProductAssetConcept:shelf_life"
    name: "Shelf life"
    concept_group: quality_compliance
    aliases: ["best-before"]
  - id: "ProductAssetConcept:quality_specification"
    name: "Quality specification"
    concept_group: quality_compliance
    aliases: ["product specification"]
  - id: "ProductAssetConcept:product_claim"
    name: "Product claim"
    concept_group: quality_compliance
    aliases: ["on-pack claim"]
    edges:
      SUPPORTED_BY:
        - {to: "ProductAssetConcept:certification", drafted_beyond_source: true}
  - id: "ProductAssetConcept:certification"
    name: "Certification"
    concept_group: quality_compliance
