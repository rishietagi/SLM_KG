  - id: "ProductAssetConcept:warehouse"
    name: "Warehouse"
    concept_group: logistics
    aliases: ["distribution centre", "DC"]
  - id: "ProductAssetConcept:finished_good"
    name: "Finished good"
    concept_group: product_definition
    aliases: ["FG"]
