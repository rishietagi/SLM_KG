        - {to: "ProductAssetConcept:category", source_reference: "docs/PROJECT_CONTEXT.md#61-known-defects-in-the-finance-spec-and-proposed-resolutions"}
  - id: "ProductAssetConcept:formulation"
    name: "Formulation"
    concept_group: product_definition
    aliases: ["formula"]
    edges:
      CONTAINS:
        - {to: "ProductAssetConcept:ingredient", source_reference: "docs/PROJECT_CONTEXT.md#54-the-11-stages"}
  - id: "ProductAssetConcept:recipe"
    name: "Recipe"
    description: "Food and beverage form of a formulation: ingredients plus process steps (mixing, cooking, baking). Formulation is the general term across sub-sectors."
    concept_group: product_definition
    edges:
      CONTAINS:
        - {to: "ProductAssetConcept:ingredient", drafted_beyond_source: true}
  - id: "ProductAssetConcept:ingredient"
    name: "Ingredient"
    concept_group: material_packaging
    aliases: ["raw material"]
    edges:
      CONTAINS:
        - {to: "ProductAssetConcept:allergen", drafted_beyond_source: true}
      CONFORMS_TO:
        - {to: "ProductAssetConcept:quality_specification", source_reference: "docs/PROJECT_CONTEXT.md#54-the-11-stages"}
  - id: "ProductAssetConcept:allergen"
    name: "Allergen"
    concept_group: quality_compliance
  - id: "ProductAssetConcept:packaging_specification"
    name: "Packaging specification"
    concept_group: material_packaging
    aliases: ["packaging material", "pack spec"]
  - id: "ProductAssetConcept:pack_price_point"
    name: "Pack and price point"
    concept_group: portfolio
    aliases: ["pack-price point", "PPP"]
  - id: "ProductAssetConcept:sku"
    name: "SKU"
    concept_group: product_definition
    aliases: ["stock-keeping unit", "item"]
