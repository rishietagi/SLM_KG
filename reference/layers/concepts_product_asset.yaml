        - {to: "ProductAssetConcept:formulation", source_reference: "docs/PROJECT_CONTEXT.md#54-the-11-stages"}
      PRODUCED_AT:
        - {to: "ProductAssetConcept:plant", source_reference: "docs/PROJECT_CONTEXT.md#54-the-11-stages"}
