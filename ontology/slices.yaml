module: slices
description: >
  Ontology slices for extraction routing (PROJECT_CONTEXT §10.2 step 2). Each chunk is routed to one
  slice; the LLM only sees that slice's classes, relationships and allowed pairs. Codegen emits
  gen/json_schema/slices/<slice>.json. Every class/relationship listed must be declared.

slices:
  trade_promotion:
    description: Promotion circulars and scheme announcements.
    route_keywords: [circular, mechanic, offer period, eligible, budget, launch]
    classes: [TradePromotion, PromotionBudget, PromotionMechanic, EligibilityRule, Brand, SKU, Customer, Distributor, Channel, Geography, FiscalPeriod]
    relationships: [FUNDS, BELONGS_TO, APPLIES_TO, TARGETS, EXECUTED_IN, VALID_IN, USES, GOVERNED_BY, VALID_DURING, ACCOUNT_OF]

  claims_settlement:
    description: Claim letters, approval notes, credit notes and settlement advices.
    route_keywords: [claim, credit note, settlement, approved, rejected, deduction, dispute]
    classes: [PromotionClaim, TradePromotion, Customer, Distributor, SKU, SalesInvoice, CreditNote, PromotionSettlement, Evidence, Currency, Deduction, Dispute]
    relationships: [CLAIMED_AGAINST, SUBMITTED_BY, REFERENCES, SUPPORTED_BY, SETTLES, REDUCES, DENOMINATED_IN, TAKEN_AGAINST, CONTESTS, ACCOUNT_OF, ISSUED_TO]

  # Outlets, SERVES, ACCOUNT_OF masters, sell-out, availability, inventory and forecasts come from the
  # structured (tabular) lane, not from document extraction (D40).
  order_to_cash:
    description: Orders, invoices and receipts described in correspondence.
    route_keywords: [invoice, order, receipt, payment, due date]
    classes: [SalesOrder, SalesInvoice, InvoiceLine, CustomerReceipt, Customer, SKU, Channel, Currency, FiscalPeriod]
    relationships: [PLACED_BY, CONTAINS, FULFILLED_THROUGH, REFERENCES, ISSUED_TO, SETTLES, OCCURRED_DURING, DENOMINATED_IN]
