  # --- Declared to resolve referenced-but-undeclared classes (PROJECT_CONTEXT §6.1) ---
  FiscalPeriod:
    layer: 2
    description: "Fiscal reporting period (reference data)."
    spec_ref: PROJECT_CONTEXT.md §6.1
    attributes:
      start_date:  {type: date, required: true}
      end_date:    {type: date, required: true}
      fiscal_year: {type: string, required: true}
  Currency:
    layer: 2
    description: "Currency (reference data)."
    spec_ref: PROJECT_CONTEXT.md §6.1
    attributes:
      iso_code: {type: string, required: true}
  Provision:
    layer: 2
    description: "Provision recognised against a receivable, tax case or other exposure."
    spec_ref: PROJECT_CONTEXT.md §6.1
    attributes:
      provision_type: {type: enum, required: true, values: [receivable, tax, other]}
      amount:         {type: decimal}
      currency:       {type: string}
  Reconciliation:
    layer: 2
    description: "Comparison of two records or balances to identify differences."
    spec_ref: PROJECT_CONTEXT.md §6.1
    attributes:
      reconciliation_type: {type: enum, required: true, values: [inventory, supplier_statement, bank, cash_gl, other]}
      status:              {type: string}
  Approval:
    layer: 2
    description: "Recorded approval of a transaction, write-off or request."
    spec_ref: PROJECT_CONTEXT.md §6.1
    attributes:
      approval_date: {type: date}
      approver:      {type: string}
      status:        {type: string}
  Resolution:
    layer: 2
    description: "Resolution closing an AP exception."
    spec_ref: PROJECT_CONTEXT.md §6.1
    attributes:
      resolution_date: {type: date}
      status:          {type: string}
  IntercompanyTransaction:
    layer: 2
    description: "Transaction between two legal entities of the same group (population deferred)."
    spec_ref: PROJECT_CONTEXT.md §6.1
    attributes:
      amount:   {type: decimal}
      currency: {type: string}

relationships:
  ADDRESSES:
    description: "Subject addresses the object (finance spec: addresses)."
    pairs:
      - {from: ManagementAction, to: Variance}
      - {from: CollectionCase, to: Receivable}
      - {from: ManagementResponse, to: Finding}
  AFFECTS:
    description: "Subject affects the object (finance spec: affects)."
    pairs:
      - {from: ObsolescenceRisk, to: InventoryItem}
      - {from: ImpairmentIndicator, to: FixedAsset}
      - {from: ImpairmentIndicator, to: CGU}
      - {from: Risk, to: L3ProcessEndpoint}
      - {from: Risk, to: FinancialAccount}
      - {from: Risk, to: FinancialStatement}
      - {from: Issue, to: Dataset}
  AGGREGATES:
    description: "Subject aggregates the object (finance spec: aggregates)."
    pairs:
      - {from: ConsolidatedBudget, to: BudgetSubmission}
      - {from: CashPosition, to: BankAccount}
  ALLOCATES:
    description: "Subject allocates the object (finance spec: allocates)."
    pairs:
      - {from: AllocationRule, to: CostPool}
  ANSWERS:
    description: "Subject answers the object (finance spec: answers)."
    pairs:
      - {from: Analysis, to: BusinessQuestion}
  APPLIES:
    description: "Subject applies the object (finance spec: applies)."
    pairs:
      - {from: TaxTransaction, to: TaxCode}
  APPLIES_TO:
    description: "Subject applies to the object (finance spec: appliesTo)."
    pairs:
      - {from: FinancialTarget, to: Dimension}
      - {from: TradePromotion, to: SKU}
      - {from: PriceCondition, to: SKU}
      - {from: PriceCondition, to: Customer}
      - {from: PriceCondition, to: Channel}
      - {from: PriceCondition, to: Geography}
  APPROVED_BY:
    description: "Subject approved by the object (finance spec: approvedBy)."
    pairs:
      - {from: CapitalRequest, to: Role}
  APPROVED_FOR:
    description: "Subject approved for the object (finance spec: approvedFor)."
    pairs:
      - {from: Budget, to: ResponsibilityCentre}
  ARISES_FROM:
    description: "Subject arises from the object (finance spec: arisesFrom)."
    pairs:
      - {from: FXExposure, to: ForecastTransaction}
      - {from: DeferredTax, to: TemporaryDifference}
  ASKS_FOR:
    description: "Subject asks for the object (finance spec: asksFor)."
    pairs:
      - {from: AuditRequest, to: Evidence}
  ASSESSED_FOR:
    description: "Subject assessed for the object (finance spec: assessedFor)."
    pairs:
      - {from: ExpectedCreditLoss, to: Customer}
  ASSIGNS_TO:
    description: "Subject assigns to the object (finance spec: assignsTo)."
    pairs:
      - {from: AllocationRule, to: CostCentre}
      - {from: AllocationRule, to: ProfitCentre}
  ATTRIBUTED_TO:
    description: "Journal line is attributed to a business dimension."
    pairs:
      - {from: JournalLine, to: BusinessUnit}
      - {from: JournalLine, to: CostCentre}
      - {from: JournalLine, to: ProfitCentre}
      - {from: JournalLine, to: SKU}
      - {from: JournalLine, to: Brand}
      - {from: JournalLine, to: Customer}
      - {from: JournalLine, to: Supplier}
      - {from: JournalLine, to: Channel}
      - {from: JournalLine, to: Geography}
  BASED_ON:
    description: "Subject based on the object (finance spec: basedOn)."
    pairs:
      - {from: Charge, to: Benchmark}
  BELONGS_TO:
    description: "Subject is a member of the object grouping or hierarchy level."
    pairs:
      - {from: ResponsibilityCentre, to: BusinessUnit}
      - {from: SKU, to: ProductFamily}
      - {from: FinancialAccount, to: AccountGroup}
