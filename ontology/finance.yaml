module: finance
description: >
  Finance ontology overlay (Layer 2 process structure + Layer 5 performance/risk), converted from
  docs/source/finance_extraction_spec.md (kept verbatim). Relationship names are UPPER_SNAKE; every original
  camelCase name is traceable through rel_name_map.yaml. Fixes from PROJECT_CONTEXT §6.1 applied.
  Attribute names are snake_case; the spec's ID attribute is recorded as source_key (DB PK is `id`).
  Classes the spec gives no attributes for carry node_base only until Phase 2 needs more.

classes:

  # --- A. PROCESS STRUCTURE --------------------
  FinanceDomain:
    layer: 2
    description: "Highest-level Finance process domain."
    source_key: financeDomainID
    spec_ref: docs/source/finance_extraction_spec.md
  ProcessGroup:
    layer: 2
    description: "L2 grouping of related Finance processes."
    source_key: processGroupID
    spec_ref: docs/source/finance_extraction_spec.md
  L3ProcessEndpoint:
    layer: 2
    description: "Executable Finance process beginning with a trigger and producing a defined output."
    source_key: processEndpointID
    spec_ref: docs/source/finance_extraction_spec.md
    attributes:
      trigger_description: {type: string, required: true}
      output_description:  {type: string, required: true}
      status:              {type: string, required: true}
  TriggerEvent:
    layer: 2
    description: "Event or condition that initiates an L3 process."
    source_key: eventID
    spec_ref: docs/source/finance_extraction_spec.md
    attributes:
      event_date: {type: date}
  ProcessOutput:
    layer: 2
    description: "Business object, decision, record or state produced by an L3 process."
    source_key: outputID
    spec_ref: docs/source/finance_extraction_spec.md
    attributes:
      output_type: {type: string, required: true}
      status:      {type: string, required: true}

  # --- B. ORGANIZATION AND RESPONSIBILITY --------------------
  # Organization: declared once in layer1_value_chain.yaml (shared with Layer 1).
  LegalEntity:
    layer: 2
    description: "Statutory reporting and contracting entity."
    source_key: legalEntityID
    spec_ref: docs/source/finance_extraction_spec.md
    attributes:
      jurisdiction:       {type: string, required: true}
      reporting_currency: {type: string, required: true}
  BusinessUnit:
    layer: 2
    description: "Operating division, category business or organizational unit."
    source_key: businessUnitID
    spec_ref: docs/source/finance_extraction_spec.md
  ResponsibilityCentre:
    layer: 2
    description: "Organizational unit accountable for financial results."
    source_key: centreID
    spec_ref: docs/source/finance_extraction_spec.md
    attributes:
      centre_type: {type: string, required: true, description: "cost, profit, revenue, investment"}
      owner:       {type: string, required: true}
  CostCentre:
    layer: 2
    description: "Responsibility centre accountable primarily for costs."
    source_key: costCentreID
    spec_ref: docs/source/finance_extraction_spec.md
    attributes:
      hierarchy_level: {type: int64, required: true}
  ProfitCentre:
    layer: 2
    description: "Responsibility centre accountable for profit."
    source_key: profitCentreID
    spec_ref: docs/source/finance_extraction_spec.md
    attributes:
      hierarchy_level: {type: int64, required: true}
  # Role: declared once in layer1_value_chain.yaml (shared with Layer 1).
  Person:
    layer: 2
    description: "Named individual explicitly identified in the source."
    source_key: personID
    spec_ref: docs/source/finance_extraction_spec.md

  # --- C. PRODUCT, MARKET AND COMMERCIAL DIMENSIONS --------------------
  Brand:
    layer: 3
    description: "Commercially identifiable consumer brand."
    source_key: brandID
    spec_ref: docs/source/finance_extraction_spec.md
    attributes:
      owner: {type: string}
  Category:
    layer: 3
    description: "Product category in the Consumer Markets hierarchy."
    source_key: categoryID
    spec_ref: docs/source/finance_extraction_spec.md
    attributes:
      gpc_brick_code: {type: string, description: "GS1 GPC brick (PROJECT_CONTEXT §7)"}
  ProductFamily:
    layer: 3
    description: "Group of related products."
    source_key: productFamilyID
    spec_ref: docs/source/finance_extraction_spec.md
    attributes:
      gpc_brick_code: {type: string, description: "GS1 GPC brick (PROJECT_CONTEXT §7)"}
  SKU:
    layer: 3
    description: "Stock-keeping unit sold, purchased, manufactured or inventoried."
    source_key: skuID
    spec_ref: docs/source/finance_extraction_spec.md
    attributes:
      pack_size:       {type: string}
      unit_of_measure: {type: string}
  Customer:
    layer: 4
    description: "Buying party."
    source_key: customerID
    spec_ref: docs/source/finance_extraction_spec.md
    attributes:
      customer_type: {type: string, required: true}
      credit_class:  {type: string}
  Supplier:
    layer: 4
    description: "Party supplying a product or service."
    source_key: supplierID
    spec_ref: docs/source/finance_extraction_spec.md
    attributes:
      supplier_type: {type: string, required: true}
  Channel:
    layer: 4
    description: "Route-to-market or customer fulfilment channel."
    source_key: channelID
    spec_ref: docs/source/finance_extraction_spec.md
    attributes:
      channel_type: {type: string, required: true}
  Geography:
    layer: 4
    description: "Country, region, state, city, market or micro-market."
    source_key: geographyID
    spec_ref: docs/source/finance_extraction_spec.md
    attributes:
      geography_level: {type: string, required: true}
  Location:
    layer: 4
    description: "Physical business, inventory, asset or operating location."
    source_key: locationID
    spec_ref: docs/source/finance_extraction_spec.md
    attributes:
      location_type: {type: string, required: true}

  # --- D. ACCOUNTING STRUCTURE --------------------
  ChartOfAccounts:
    layer: 2
    description: "Governed hierarchy of financial accounts."
    source_key: chartID
    spec_ref: docs/source/finance_extraction_spec.md
    attributes:
      version: {type: string}
  FinancialAccount:
    layer: 2
    description: "Individual chart-of-accounts element."
    source_key: accountID
    spec_ref: docs/source/finance_extraction_spec.md
    attributes:
      account_type:      {type: string, required: true}
      account_hierarchy: {type: string, required: true}
  AccountGroup:
    layer: 2
    description: "Grouping of accounts for reporting or governance."
    source_key: accountGroupID
    spec_ref: docs/source/finance_extraction_spec.md
    attributes:
      group_type: {type: string, required: true}
  GeneralLedger:
    layer: 2
    description: "Principal accounting book."
    source_key: ledgerID
    spec_ref: docs/source/finance_extraction_spec.md
    attributes:
      ledger_type: {type: string, required: true}
  SubLedger:
    layer: 2
    description: "Supporting ledger for a particular transaction class."
    source_key: subLedgerID
    spec_ref: docs/source/finance_extraction_spec.md
    attributes:
      sub_ledger_type: {type: string, required: true}
  AccountingPolicy:
    layer: 2
    description: "Approved financial-accounting treatment or rule."
    source_key: policyID
    spec_ref: docs/source/finance_extraction_spec.md
    attributes:
      effective_date: {type: date}
  AccountingStandard:
    layer: 2
    description: "Financial reporting standard explicitly referenced."
    source_key: standardID
    spec_ref: docs/source/finance_extraction_spec.md
    attributes:
      jurisdiction: {type: string}
  JournalEntry:
    layer: 2
    description: "Balanced accounting document."
    source_key: journalID
    spec_ref: docs/source/finance_extraction_spec.md
    attributes:
      journal_date: {type: date, required: true}
      posting_date: {type: date, required: true}
      status:       {type: string, required: true}
  JournalLine:
    layer: 2
    description: "Individual debit or credit posting."
    source_key: journalLineID
    spec_ref: docs/source/finance_extraction_spec.md
    attributes:
      amount:                 {type: decimal, required: true}
      debit_credit_indicator: {type: enum, required: true, values: [debit, credit]}
      currency:               {type: string, required: true}
      posting_date:           {type: date, required: true}
  TrialBalance:
    layer: 2
    description: "Account balances used for entity reporting or consolidation."
    source_key: trialBalanceID
    spec_ref: docs/source/finance_extraction_spec.md
    attributes:
      period:       {type: string, required: true}
      legal_entity: {type: string, required: true}
      version:      {type: string, required: true}
  Balance:
    layer: 2
    description: "Financial balance for an account and dimensional context."
    source_key: balanceID
    spec_ref: docs/source/finance_extraction_spec.md
    attributes:
      amount:       {type: decimal, required: true}
      currency:     {type: string, required: true}
      balance_date: {type: date, required: true}

  # --- E. TRANSACTIONS AND DOCUMENTS --------------------
  SalesOrder:
    layer: 2
    description: "Customer order for products or services."
    source_key: salesOrderID
    spec_ref: docs/source/finance_extraction_spec.md
    attributes:
      order_date: {type: date, required: true}
      status:     {type: string, required: true}
  SalesInvoice:
    layer: 2
    description: "Customer billing document."
    source_key: invoiceID
    spec_ref: docs/source/finance_extraction_spec.md
    attributes:
      invoice_date: {type: date, required: true}
      due_date:     {type: date, required: true}
      amount:       {type: decimal, required: true}
      currency:     {type: string, required: true}
      status:       {type: string, required: true}
  InvoiceLine:
    layer: 2
    description: "Individual product or service line on an invoice."
    source_key: invoiceLineID
    spec_ref: docs/source/finance_extraction_spec.md
    attributes:
      quantity:    {type: double, required: true}
      unit_price:  {type: decimal, required: true}
      line_amount: {type: decimal, required: true}
      unit:        {type: string, description: "Quantity unit (e.g. case, unit); added for CQ6 (D39)"}
  CreditNote:
    layer: 2
    description: "Document reducing a customer invoice or receivable."
    source_key: creditNoteID
    spec_ref: docs/source/finance_extraction_spec.md
    attributes:
      document_date: {type: date, required: true}
      amount:        {type: decimal, required: true}
      currency:      {type: string, required: true}
      reason_code:   {type: string, required: true}
  DebitNote:
    layer: 2
    description: "Document increasing an amount payable or receivable."
    source_key: debitNoteID
    spec_ref: docs/source/finance_extraction_spec.md
    attributes:
      document_date: {type: date, required: true}
      amount:        {type: decimal, required: true}
      currency:      {type: string, required: true}
      reason_code:   {type: string, required: true}
  CustomerReceipt:
    layer: 2
    description: "Customer payment received."
    source_key: receiptID
    spec_ref: docs/source/finance_extraction_spec.md
    attributes:
      receipt_date: {type: date, required: true}
      amount:       {type: decimal, required: true}
      currency:     {type: string, required: true}
  Receivable:
    layer: 2
    description: "Amount due from a customer."
    source_key: receivableID
    spec_ref: docs/source/finance_extraction_spec.md
    attributes:
      amount:   {type: decimal, required: true}
      due_date: {type: date, required: true}
      status:   {type: string, required: true}
  SupplierInvoice:
    layer: 2
    description: "Supplier billing document."
    source_key: supplierInvoiceID
    spec_ref: docs/source/finance_extraction_spec.md
    attributes:
      invoice_date: {type: date, required: true}
      due_date:     {type: date, required: true}
      amount:       {type: decimal, required: true}
      currency:     {type: string, required: true}
      status:       {type: string, required: true}
  PurchaseOrder:
    layer: 2
    description: "Approved order issued to a supplier."
    source_key: purchaseOrderID
    spec_ref: docs/source/finance_extraction_spec.md
    attributes:
      order_date: {type: date, required: true}
      amount:     {type: decimal, required: true}
      currency:   {type: string, required: true}
      status:     {type: string, required: true}
  GoodsReceipt:
    layer: 2
    description: "Confirmation that ordered goods or services were received."
    source_key: receiptID
    spec_ref: docs/source/finance_extraction_spec.md
    attributes:
      receipt_date: {type: date, required: true}
      quantity:     {type: double, required: true}
      status:       {type: string, required: true}
  APDocument:
    layer: 2
    description: "Accounts-payable accounting document."
    source_key: apDocumentID
    spec_ref: docs/source/finance_extraction_spec.md
    attributes:
      posting_date: {type: date, required: true}
      amount:       {type: decimal, required: true}
      status:       {type: string, required: true}
  SupplierPayment:
    layer: 2
    description: "Payment made to a supplier."
    source_key: paymentID
    spec_ref: docs/source/finance_extraction_spec.md
    attributes:
      payment_date: {type: date, required: true}
      amount:       {type: decimal, required: true}
      currency:     {type: string, required: true}
      status:       {type: string, required: true}
  BankTransaction:
    layer: 2
    description: "Transaction recorded in a bank account."
    source_key: bankTransactionID
    spec_ref: docs/source/finance_extraction_spec.md
    attributes:
      document_date:    {type: date, required: true}
      amount:           {type: decimal, required: true}
      currency:         {type: string, required: true}
      transaction_type: {type: string, required: true}
  BankAccount:
    layer: 2
    description: "Financial account held with a bank."
    source_key: bankAccountID
    spec_ref: docs/source/finance_extraction_spec.md
    attributes:
      bank_name:        {type: string, required: true}
      account_currency: {type: string, required: true}
      account_type:     {type: string, required: true}
  PaymentFile:
    layer: 2
    description: "File or instruction transmitted for payment execution."
    source_key: paymentFileID
    spec_ref: docs/source/finance_extraction_spec.md
    attributes:
      creation_date: {type: date, required: true}
      payment_count: {type: int64, required: true}
      total_amount:  {type: decimal, required: true}
      status:        {type: string, required: true}

  # --- F. PLANNING AND PERFORMANCE --------------------
  BusinessObjective:
    layer: 5
    description: "Intended enterprise or financial outcome."
    source_key: objectiveID
    spec_ref: docs/source/finance_extraction_spec.md
  # ValueDriver: declared once in layer1_value_chain.yaml (shared with Layer 1).
  FinancialTarget:
    layer: 5
    description: "Approved target for a financial measure."
    source_key: targetID
    spec_ref: docs/source/finance_extraction_spec.md
    attributes:
      metric:       {type: string, required: true}
      target_value: {type: decimal, required: true}
      unit:         {type: string, required: true}
      period:       {type: string, required: true}
  PlanningCycle:
    layer: 2
    description: "Governed planning or forecasting cycle."
    source_key: planningCycleID
    spec_ref: docs/source/finance_extraction_spec.md
    attributes:
      cycle_type: {type: string, required: true}
      start_date: {type: date, required: true}
      end_date:   {type: date, required: true}
  PlanningAssumption:
    layer: 2
    description: "Approved input used in a budget, forecast or scenario."
    source_key: assumptionID
    spec_ref: docs/source/finance_extraction_spec.md
    attributes:
      value:            {type: string, required: true}
      unit:             {type: string, required: true}
      effective_period: {type: string, required: true}
      version:          {type: string, required: true}
  PlanningDriver:
    layer: 2
    description: "Quantitative or qualitative forecasting driver."
    source_key: planningDriverID
    spec_ref: docs/source/finance_extraction_spec.md
    attributes:
      value: {type: string, required: true}
      unit:  {type: string, required: true}
  Budget:
    layer: 2
    description: "Approved financial plan."
    source_key: budgetID
    spec_ref: docs/source/finance_extraction_spec.md
    attributes:
      version:  {type: string, required: true}
      scenario: {type: string, required: true}
      period:   {type: string, required: true}
      amount:   {type: decimal, required: true}
      currency: {type: string, required: true}
  BudgetSubmission:
    layer: 2
    description: "Organizational budget submitted for consolidation."
    source_key: submissionID
    spec_ref: docs/source/finance_extraction_spec.md
    attributes:
      submitting_unit: {type: string, required: true}
      version:         {type: string, required: true}
      submission_date: {type: date, required: true}
      status:          {type: string, required: true}
  ConsolidatedBudget:
    layer: 2
    description: "Aggregated and approved enterprise budget."
    source_key: consolidatedBudgetID
    spec_ref: docs/source/finance_extraction_spec.md
    attributes:
      version: {type: string, required: true}
      period:  {type: string, required: true}
      status:  {type: string, required: true}
  Forecast:
    layer: 2
    description: "Expected future financial result. Distinct from DemandForecast (volume, Stage 6)."
    source_key: forecastID
    spec_ref: docs/source/finance_extraction_spec.md
    attributes:
      version:  {type: string, required: true}
      scenario: {type: string, required: true}
      period:   {type: string, required: true}
      amount:   {type: decimal, required: true}
      currency: {type: string, required: true}
  ForecastVersion:
    layer: 2
    description: "Identifiable version of a forecast."
    source_key: forecastVersionID
    spec_ref: docs/source/finance_extraction_spec.md
    attributes:
      creation_date: {type: date, required: true}
      status:        {type: string, required: true}
  Scenario:
    layer: 2
    description: "Alternative set of planning assumptions."
    source_key: scenarioID
    spec_ref: docs/source/finance_extraction_spec.md
  ActualResult:
    layer: 5
    description: "Observed financial or performance result."
    source_key: resultID
    spec_ref: docs/source/finance_extraction_spec.md
    attributes:
      metric: {type: string, required: true}
      value:  {type: decimal, required: true}
      unit:   {type: string, required: true}
      period: {type: string, required: true}
  Variance:
    layer: 5
    description: "Difference between two comparable financial results."
    source_key: varianceID
    spec_ref: docs/source/finance_extraction_spec.md
    attributes:
      variance_type:    {type: string, required: true, description: "e.g. budget, forecast, prior_year, cost (CostVariance, §6.1)"}
      value:            {type: decimal, required: true}
      unit:             {type: string, required: true}
      comparison_basis: {type: string, required: true}
  VarianceDriver:
    layer: 5
    description: "Identified factor causing a variance."
    source_key: driverID
    spec_ref: docs/source/finance_extraction_spec.md
    attributes:
      driver_type: {type: enum, required: true, values: [price, volume, mix, fx, material_cost, freight, timing], description: "Subtypes collapsed into a type property (§6.1)"}
      value:       {type: decimal, required: true}
      unit:        {type: string, required: true}
  ManagementAction:
    layer: 5
    description: "Owned intervention addressing a variance, risk or performance issue."
    source_key: actionID
    spec_ref: docs/source/finance_extraction_spec.md
    attributes:
      owner:            {type: string, required: true}
      due_date:         {type: date, required: true}
      status:           {type: string, required: true}
      expected_benefit: {type: string}

  # --- G. COMMERCIAL FINANCE --------------------
  ListPrice:
    layer: 2
    description: "Published or approved base product price."
    spec_ref: docs/source/finance_extraction_spec.md
  NetPrice:
    layer: 2
    description: "Price after relevant discounts or commercial adjustments."
    spec_ref: docs/source/finance_extraction_spec.md
  PriceCondition:
    layer: 2
    description: "Price, discount or commercial term applying to a transaction or scope."
    source_key: priceConditionID
    spec_ref: docs/source/finance_extraction_spec.md
    attributes:
      condition_type: {type: string, required: true}
      value:          {type: decimal, required: true}
      unit:           {type: string, required: true}
      effective_from: {type: string, required: true}
      effective_to:   {type: string, required: true}
  Discount:
    layer: 2
    description: "Reduction from list or invoice price."
    source_key: discountID
    spec_ref: docs/source/finance_extraction_spec.md
    attributes:
      discount_type: {type: string, required: true}
      value:         {type: decimal, required: true}
      unit:          {type: string, required: true}
  TradePromotion:
    layer: 2
    description: "Customer- or channel-facing commercial programme intended to influence sales."
    source_key: promotionID
    spec_ref: docs/source/finance_extraction_spec.md
    attributes:
      promotion_type: {type: string, required: true}
      start_date:     {type: date, required: true}
      end_date:       {type: date, required: true}
      status:         {type: string, required: true}
  PromotionMechanic:
    layer: 2
    description: "Commercial method used by a promotion."
    spec_ref: docs/source/finance_extraction_spec.md
    attributes:
      mechanic_type: {type: string, description: "Spec examples: price discount; rebate; bundle; free goods; display allowance; volume incentive"}
  PromotionBudget:
    layer: 2
    description: "Approved financial envelope for a trade promotion."
    source_key: promotionBudgetID
    spec_ref: docs/source/finance_extraction_spec.md
    attributes:
      amount:   {type: decimal, required: true}
      currency: {type: string, required: true}
      period:   {type: string, required: true}
  EligibilityRule:
    layer: 2
    description: "Rule determining whether a transaction or claim qualifies for a promotion."
    source_key: eligibilityRuleID
    spec_ref: docs/source/finance_extraction_spec.md
    attributes:
      effective_from: {type: string, required: true}
      effective_to:   {type: string, required: true}
  PromotionAccrual:
    layer: 2
    description: "Expected promotion or rebate liability."
    source_key: accrualID
    spec_ref: docs/source/finance_extraction_spec.md
    attributes:
      amount:       {type: decimal, required: true}
      currency:     {type: string, required: true}
      posting_date: {type: date, required: true}
      status:       {type: string, required: true}
  PromotionClaim:
    layer: 2
    description: "Claim submitted against promotion terms."
    source_key: claimID
    spec_ref: docs/source/finance_extraction_spec.md
    attributes:
      claim_date:      {type: date, required: true}
      claim_amount:    {type: decimal, required: true}
      currency:        {type: string, required: true}
      approved_amount: {type: decimal, required: true}
      status:          {type: string, required: true}
  PromotionSettlement:
    layer: 2
    description: "Financial settlement of an approved promotion claim."
    source_key: settlementID
    spec_ref: docs/source/finance_extraction_spec.md
    attributes:
      settlement_date:   {type: date, required: true}
      amount:            {type: decimal, required: true}
      currency:          {type: string, required: true}
      settlement_method: {type: string, required: true}
  PromotionResult:
    layer: 5
    description: "Measured commercial and financial result of a promotion."
    source_key: promotionResultID
    spec_ref: docs/source/finance_extraction_spec.md
    attributes:
      period:              {type: string, required: true}
      incremental_volume:  {type: decimal, required: true}
      incremental_revenue: {type: decimal, required: true}
      incremental_margin:  {type: decimal, required: true}
  TradeSpend:
    layer: 5
    description: "Discount, rebate, promotion or commercial investment reducing gross-to-net revenue."
    source_key: tradeSpendID
    spec_ref: docs/source/finance_extraction_spec.md
    attributes:
      spend_type: {type: string, required: true}
      amount:     {type: decimal, required: true}
      currency:   {type: string, required: true}
      period:     {type: string, required: true}
  BaselineSales:
    layer: 5
    description: "Expected sales without the promotion."
    spec_ref: docs/source/finance_extraction_spec.md
  IncrementalSales:
    layer: 5
    description: "Sales attributable to the promotion above baseline."
    spec_ref: docs/source/finance_extraction_spec.md
  PVMAnalysis:
    layer: 5
    description: "Analysis decomposing performance into price, volume and mix effects."
    source_key: analysisID
    spec_ref: docs/source/finance_extraction_spec.md
    attributes:
      period:            {type: string, required: true}
      comparison_period: {type: string, required: true}
      price_effect:      {type: decimal, required: true}
      volume_effect:     {type: decimal, required: true}
      mix_effect:        {type: decimal, required: true}
  Revenue:
    layer: 5
    description: "Recognized or operational revenue amount."
    spec_ref: docs/source/finance_extraction_spec.md
  Margin:
