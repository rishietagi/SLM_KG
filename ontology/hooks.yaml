module: hooks
description: >
  Cross-layer hook relationships (PROJECT_CONTEXT §5.3). Since the 2026-10-05 scope change (DECISIONS D50)
  the outer layers hold sector concepts, not instances, so hooks target the concept classes declared in
  intelligence_layers.yaml. Layer 2 hooks to ProcessGroup / L3ProcessEndpoint (finance.yaml).

relationships:
  ENABLED_BY:
    description: Activity is executed through the functional process.
    hook_layer: 2
    pairs:
      - {from: ValueChainActivity, to: ProcessGroup}
      - {from: ValueChainActivity, to: L3ProcessEndpoint}

  ACTS_ON:
    description: Activity creates, changes or uses the product or asset concept.
    hook_layer: 3
    pairs:
      - {from: ValueChainActivity, to: ProductAssetConcept}

  INVOLVES:
    description: Activity involves the ecosystem participant, channel or geography concept.
    hook_layer: 4
    pairs:
      - {from: ValueChainActivity, to: EcosystemConcept}

  MEASURED_BY:
    description: Value outcome is measured by the KPI.
    hook_layer: 5
    pairs:
      - {from: ValueOutcome, to: KPI}

  AFFECTS:
    description: Risk type affects the activity.
    hook_layer: 5
    pairs:
      - {from: RiskType, to: ValueChainActivity}

  TOUCHES:
    description: Activity touches the consumer and experience concept.
    hook_layer: 6
    pairs:
      - {from: ValueChainActivity, to: ConsumerConcept}
