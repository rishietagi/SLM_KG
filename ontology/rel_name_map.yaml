module: rel_name_map
description: >
  Traceability from finance-spec relationship names (camelCase) to canonical UPPER_SNAKE names.
  One entry per original (subject, relationship, object) triple in the spec. canonical_from /
  canonical_to are set only when a class was mapped or retargeted. Actions: converted (case only),
  renamed, mapped (class substituted), retargeted, deferred, dropped.

added:
  - {canonical: BELONGS_TO_BRAND, from: ProductFamily, to: Brand, note: "Brand hierarchy independent of Category (§6.1)"}
  - {canonical: PARENT_OF, from: Category, to: Category, note: "Category hierarchy (§6.1)"}
  - {canonical: BELONGS_TO, from: CostCentre, to: BusinessUnit, note: "Replaces isA ResponsibilityCentre (D16)"}
  - {canonical: BELONGS_TO, from: ProfitCentre, to: BusinessUnit, note: "Replaces isA ResponsibilityCentre (D16)"}

