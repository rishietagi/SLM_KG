# Expected answers for competency questions 1-4 on the curated Layer-1 graph.
cq1:
  term: trade scheme creation
  activity: Create trade scheme
  stage: Customer, Channel and Revenue Growth
  upstream: Warehousing and Distribution
  downstream: Retail and Outlet Execution

cq2:
  # (Stage 3 output, Stage 4 activity) hand-offs
  pairs:
    - [Formulation, Translate formulation into material requirements]
    - [Recipe, Translate formulation into material requirements]
    - [Ingredient specification, Identify and qualify suppliers]
    - [Ingredient specification, Approve ingredients and packaging]
    - [Product specification, Approve ingredients and packaging]
    - [Launch-ready SKU specification, Translate formulation into material requirements]
    - [Launch-ready SKU specification, Approve ingredients and packaging]

cq3:
  term: consensus forecast
  activities:
    - Develop supply plan
    - Conduct capacity planning
    - Calculate material requirement
    - Set inventory target
    - Conduct S&OP or IBP review
    - Set sales target

cq4:
  shared_aspects: [process type, hygiene and safety regime, shelf life and release, batching, in-process checks, labelling, release basis]

cq5:
  stage: 9
  endpoints:
    - Accrue trade promotion liability
    - Evaluate post-event promotion ROI
    - Measure distributor and channel performance
    - Record secondary sales and sell-out
    - Settle approved claims
    - True up trade accruals at period end
    - Validate trade scheme claims

cq6:
  min_primary_uplift: 0.30   # "loaded": primary (sell-in) volume up at least 30% vs the equal-length pre-period
  max_sell_out_uplift: 0.10  # "no sell-through": outlet sell-out up at most 10%

cq7:
  promotion: TP2026-005
